<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fff6e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a33" media="(prefers-color-scheme: dark)">
<title>PotatoBrawl · Stats</title>
<!-- Jonny's private play-count page, served at /stats by stats.js (public/stats.html, copied from web/ by game/build.py).
     The key is the text after # in the link; it is posted to /api/stats/data and never stored. Inline style and script only,
     no external script or image: the server sends a strict Content-Security-Policy. Everything from the data goes in as text. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ef7a52'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fff6e4; --raised: #fffaf0; --ink: #0e1022; --muted: #646678;
  --rule: #0e1022; --line: rgba(14, 16, 34, 0.14);
  --bar: rgba(14, 16, 34, 0.24); --bar-hi: rgba(14, 16, 34, 0.42); --bar-lo: rgba(14, 16, 34, 0.11);
  --ember: #ef7a52; --gold: #f4c95d; --on-ember: #0e1022;
  --head: "Barlow Condensed", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171a33; --raised: #232746; --ink: #eef0fa; --muted: #a4a9c8;
    --rule: rgba(238, 240, 250, 0.5); --line: rgba(206, 210, 255, 0.14);
    --bar: rgba(206, 210, 255, 0.3); --bar-hi: rgba(206, 210, 255, 0.52); --bar-lo: rgba(206, 210, 255, 0.14);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--body); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* title + updated line + range pills */
.top { padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; }
h1 { margin: 0; font: 800 30px/1 var(--head); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
.metarow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; min-height: 30px; }
.meta { margin: 0; color: var(--muted); font-size: 13px; }
.mini { flex: none; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; cursor: pointer; font: 700 12px/1 var(--head); letter-spacing: 0.12em; text-transform: uppercase; }
.mini:disabled { opacity: 0.5; cursor: default; }
.pillbar { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); padding: 8px 0; }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill { padding: 11px 0 10px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; cursor: pointer; font: 700 15px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; }
.pill[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: var(--on-ember); }

/* sections */
main { padding-bottom: 40px; min-height: 40vh; }
section { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--rule); }
.pillbar + main section:first-child { margin-top: 18px; }
h2 { margin: 0; font: 800 25px/1.1 var(--head); text-transform: uppercase; letter-spacing: 0.05em; }
h3 { margin: 24px 0 9px; font: 700 13px/1.2 var(--head); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
.base { margin: 4px 0 14px; color: var(--muted); font-size: 13px; }
.empty, .mut { color: var(--muted); }
.empty { margin: 6px 0 0; font-size: 14px; }
h3 + .empty { margin-top: 0; }
.small { font-size: 13px; }
p { margin: 8px 0 0; }
.foot { margin-top: 38px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

/* messages (no link, wrong link, no network) */
.msg { padding: 56px 4px 20px; text-align: center; }
.msg p { margin: 0 auto; max-width: 30ch; font-size: 19px; line-height: 1.35; }

/* pulse */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); padding: 12px 14px 13px; min-width: 0; }
.tile .k { font: 700 12px/1 var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tile .v { margin: 8px 0 5px; font: 800 46px/1 var(--head); }
.tile .s { color: var(--muted); font-size: 13px; line-height: 1.35; }
.tile .s b { color: var(--ink); font-weight: 600; }
.spark { display: block; width: 100%; height: auto; overflow: visible; }
.spark-cap { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 2px; }
.sl-line { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
.sl-base { stroke: var(--line); stroke-width: 1; }
.sl-dot { fill: var(--ember); }
.sl-t { fill: var(--muted); font: 12px var(--body); }

/* horizontal bars */
.rows { display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: minmax(84px, 36%) 1fr; gap: 10px; align-items: center; }
.row .lab { font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.track { position: relative; height: 22px; border-left: 1px solid var(--rule); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 3px 3px 0; }
.fill.em { background: var(--ember); }
.num { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font: 600 13px/1 var(--body); white-space: nowrap; }
.num.in { left: 8px; }
.num.on-em { color: var(--on-ember); }
.segs { display: flex; gap: 2px; height: 100%; }
.sg { display: flex; align-items: center; min-width: 0; padding-left: 8px; background: var(--bar); border-radius: 0 3px 3px 0; font: 600 13px/1 var(--body); white-space: nowrap; overflow: hidden; }
.sg.em { background: var(--ember); color: var(--on-ember); }
.sg.hi { background: var(--bar-hi); }
.sg.lo { background: var(--bar-lo); }
.sg.thin { padding-left: 0; }
.fn { margin-bottom: 11px; }
.fn .lh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; font-size: 14px; }
.fn .lh .mut { font-size: 13px; text-align: right; }
.fn .track { height: 28px; }
.fn.key .lab { font-weight: 600; }
.steps { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; font-size: 14px; }
.steps span { white-space: nowrap; }
.steps b { font-weight: 600; }

/* cohort grid */
.cw { margin-bottom: 12px; padding-left: 10px; border-left: 3px solid transparent; }
.cw.now { border-left-color: var(--ember); }
.cw-t { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.cw-t span { font-weight: 400; color: var(--muted); }
.cw-c { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.cc { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 48px; padding: 4px 2px 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); text-align: center; }
.cc small { color: var(--muted); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; line-height: 1.1; }
.cc b { font: 700 17px/1.2 var(--head); letter-spacing: 0.01em; }
.cc .sm { color: var(--muted); font-size: 11px; line-height: 1.1; }
.cc .dots { color: var(--muted); font-weight: 400; opacity: 0.8; }
.cc.wait b { color: var(--muted); font-weight: 600; font-size: 22px; line-height: 1; }

/* what they play */
.mrow { margin-bottom: 14px; }
.mh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.mn { font-size: 15px; font-weight: 600; }
.mc { color: var(--muted); font-size: 13px; }
.mrow .track { height: 18px; }
.ms { margin-top: 3px; color: var(--muted); font-size: 12.5px; line-height: 1.35; }

/* hooks */
.road { display: grid; grid-template-columns: 74px repeat(8, 1fr); gap: 3px; align-items: center; }
.road .rn { font-size: 12.5px; line-height: 1.15; }
.road .rh { color: var(--muted); font-size: 11px; text-align: center; }
.road .rc { display: flex; align-items: center; justify-content: center; height: 30px; border: 1px solid var(--line); border-radius: 4px; font-size: 12.5px; font-weight: 600; }
.boss { margin-bottom: 14px; }
.boss .mn { margin-bottom: 4px; }
.brow { display: grid; grid-template-columns: 62px 1fr 108px; gap: 8px; align-items: center; margin-top: 4px; font-size: 13px; }
.brow .track { height: 14px; }
.brow .fill { background: var(--bar-lo); outline: 1px solid var(--line); outline-offset: -1px; }
.brow .fill.em { background: var(--ember); outline: 0; }
.brow .bt { color: var(--muted); white-space: nowrap; }
.kv > div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv .kl small { display: block; margin-top: 1px; color: var(--muted); font-size: 12.5px; }
.kv .n { font: 700 21px/1 var(--head); text-align: right; }
.peaks { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin-top: 30px; border-bottom: 1px solid var(--rule); }
.peaks i { position: relative; flex: 1 1 0; min-width: 2px; background: var(--bar); border-radius: 2px 2px 0 0; }
.peaks i b { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding-bottom: 2px; font: 600 12px/1 var(--body); }
.peaks i.today { background: var(--ember); }
.peaks i.hi { background: var(--bar-hi); }

/* health */
.err { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.err b { font-weight: 700; text-align: right; }
.err code { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (min-width: 600px) {
  body { font-size: 16px; }
  h1 { font-size: 36px; }
  .tile .v { font-size: 56px; }
  .tile { padding: 14px 18px 16px; }
  .row { grid-template-columns: 170px 1fr; }
  .brow { grid-template-columns: 80px 1fr 130px; }
  .road { grid-template-columns: 90px repeat(8, 1fr); }
  .cc b { font-size: 19px; }
  .cc small { font-size: 11px; }
}
</style>
</head>
<body>
<header class="wrap top">
  <h1>PotatoBrawl · Stats</h1>
  <div class="metarow">
    <p class="meta" id="meta">&nbsp;</p>
    <button class="mini" id="refresh" type="button" hidden>Refresh</button>
  </div>
</header>
<div class="pillbar" id="pillbar" hidden>
  <div class="wrap"><div class="pills" role="group" aria-label="Range">
    <button class="pill" type="button" data-range="today" aria-pressed="false">Today</button>
    <button class="pill" type="button" data-range="week" aria-pressed="true">Week</button>
    <button class="pill" type="button" data-range="month" aria-pressed="false">Month</button>
  </div></div>
</div>
<main class="wrap" id="main" data-state="loading"><noscript><div class="msg"><p>This page needs JavaScript.</p></div></noscript></main>
<script>
(function () {
  "use strict";
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var EMBER = "239,122,82";
  var tbl = function (o) { return Object.assign(Object.create(null), o); };
  var MODES = tbl({ tutorial: "Tutorial", trial: "Combo trial", practice: "Practice", ranked: "Ranked", daily: "Daily Potato", cup: "Tournament", road: "Road", boss: "Boss fight", "road-boss": "Road boss", online: "Online", "online-boss": "Online boss", team: "Team Brawl 2v2" });
  var FIGHTERS = tbl({ dragon: "Dragon", samurai: "Samurai", wizard: "Wizard", phoenix: "Phoenix", odin: "Odin", alchemist: "Alchemist", gunslinger: "Gunslinger", reaper: "Reaper" });
  var BOSSES = tbl({ scratch: "Old Scratch", zorp: "Zorp", kraken: "Kraken Spud" });
  var LEVELS = ["Normal", "Hard", "Nightmare"];
  var REGIONS = ["The Field", "The Kitchen", "The Deep"];
  var STEPS = ["move", "jump", "light", "heavy", "charge", "special", "dodge", "ult", "off"];
  var WHERE = tbl({ menu: "Menu", select: "Fighter select", result: "Results", online: "Online", road: "Road", cup: "Tournament" });
  var FL = [["0", "Under 1 min"], ["1", "1–3 min"], ["3", "3–10 min"], ["10", "10–30 min"], ["30", "30+ min"]];
  var FM = [["0", "None"], ["1", "1 match"], ["2", "2 matches"], ["3", "3 or more"]];
  var ML = [["0", "Under 1 min"], ["1", "1–2 min"], ["2", "2–3 min"], ["3", "3–5 min"], ["5", "5+ min"]];
  var RETS = [1, 3, 7, 14, 30];

  var $ = function (id) { return document.getElementById(id); };
  var st = { data: null, range: "week", at: 0, busy: false, err: null, key: "", sparkEl: null, sparkPts: null };
  var C = null;   // the numbers of this render

  // ---------- small DOM helpers: data only ever goes in as text
  function put(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { put(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v; else el.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) put(el, arguments[i]);
    return el;
  }
  var NS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.appendChild(document.createTextNode(String(text)));
    return e;
  }

  // ---------- dates (calendar days as day numbers; Monday-start weeks)
  function dn(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5; }
  function ds(n) { return new Date(n * 864e5).toISOString().slice(0, 10); }
  function fd(n) { var s = ds(n); return +s.slice(8) + " " + MON[+s.slice(5, 7) - 1]; }
  function wdi(n) { return (((n + 3) % 7) + 7) % 7; }   // 0 = Monday
  function span(a, b) { var l = []; for (var n = a; n <= b; n++) l.push(ds(n)); return l; }
  function mkRange(id, t) {
    var from, p0, p1;
    if (id === "today") { from = t; p0 = p1 = t - 1; }
    else if (id === "week") { from = t - wdi(t); p0 = from - 7; p1 = from - 1; }
    else { from = dn(ds(t).slice(0, 8) + "01"); p1 = from - 1; p0 = dn(ds(p1).slice(0, 8) + "01"); }
    return { id: id, from: from, to: t, days: span(from, t), pdays: span(p0, p1),
      now: { today: "today", week: "this week", month: "this month" }[id], prev: { today: "yesterday", week: "last week", month: "last month" }[id] };
  }

  // ---------- counting
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function plural(n, w, pl) { return fmt(n) + " " + (n === 1 ? w : pl || w + "s"); }
  function modeName(id) { return MODES[id] || id; }
  function fighterName(id) { return FIGHTERS[id] || cap(id); }
  function cnt(day, key) { var o = C.D[day]; return o ? (+o[key] || 0) : 0; }
  function S(days, key) { var t = 0; for (var i = 0; i < days.length; i++) t += cnt(days[i], key); return t; }
  function P(days, prefix) {   // every key starting with prefix, summed: {rest of the key: count}
    var out = Object.create(null);
    for (var i = 0; i < days.length; i++) {
      var o = C.D[days[i]]; if (!o) continue;
      for (var k in o) if (k.indexOf(prefix) === 0) { var r = k.slice(prefix.length); out[r] = (out[r] || 0) + (+o[k] || 0); }
    }
    return out;
  }
  function sorted(map) {
    return Object.keys(map).map(function (k) { return [k, map[k]]; }).filter(function (e) { return e[1] > 0; })
      .sort(function (a, b) { return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); });
  }
  function total(map) { var t = 0; for (var k in map) t += map[k]; return t; }
  // small numbers stay honest: under 20 no percent at all, 20-100 rounded to 5%, above 100 whole percent
  function pct(n, b) { if (!b || b < 20) return ""; var p = 100 * n / b; return (b > 100 ? Math.round(p) : Math.round(p / 5) * 5) + "%"; }
  function ofPct(n, b) { var p = pct(n, b); return fmt(n) + " of " + fmt(b) + (p ? " (" + (b > 100 ? "" : "about ") + p + ")" : ""); }
  function finishedOf(days, filter) {   // matches finished (win + loss + draw), optionally only modes passing filter
    var me = P(days, "me:"), t = 0;
    for (var k in me) { var p = k.split(":"); if (p[1] === "win" || p[1] === "loss" || p[1] === "draw") if (!filter || filter(p[0])) t += me[k]; }
    return t;
  }

  function fxName(id) {
    if (WHERE[id]) return WHERE[id];
    if (id.indexOf("tut:") === 0) return "Tutorial · " + cap(id.slice(4));
    if (id.indexOf("match:") === 0) {
      var m = modeName(id.slice(6)), art = /^[aeiou]/i.test(m) ? "an " : "a ";
      return "In " + art + m + (/(fight|trial)$/i.test(m) ? "" : " match");
    }
    return cap(id);
  }

  // ---------- the numbers behind one render
  function context(data, rangeId) {
    var tn = dn(data.today), D = data.days || {}, ret = {}, first = Infinity;
    Object.keys(D).forEach(function (d) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !D[d] || typeof D[d] !== "object") { delete D[d]; return; }
      var n = dn(d); if (n < first) first = n;
      for (var k in D[d]) if (k.indexOf("ret:") === 0) {
        var p = k.split(":"); if (p.length !== 3) continue;
        (ret[p[1]] || (ret[p[1]] = {}))[p[2]] = (ret[p[1]][p[2]] || 0) + (+D[d][k] || 0);
      }
    });
    return { D: D, tn: tn, today: data.today, ret: ret, first: first, R: mkRange(rangeId, tn) };
  }

  // ---------- reusable pieces
  function sec(title, base) {
    var s = h("section", null, h("h2", null, title));
    if (base != null) s.appendChild(h("p", { class: "base" }, base));
    return s;
  }
  function note(t) { return h("p", { class: "empty" }, t); }
  function pctW(v, max) { return max > 0 ? Math.min(100, Math.max(0, v / max * 100)) : 0; }
  function track(v, max, cls, text) {   // one bar with its count written on it (or just after it when the bar is short)
    var w = pctW(v, max), inside = w >= 18;
    return h("div", { class: "track" },
      h("i", { class: "fill " + (cls || ""), style: "width:" + w.toFixed(2) + "%" + (v > 0 ? ";min-width:3px" : "") }),
      h("b", { class: "num " + (inside ? "in" : "out") + (inside && cls === "em" ? " on-em" : ""), style: inside ? "" : "left:calc(" + w.toFixed(2) + "% + 7px)" }, text || fmt(v)));
  }
  function segTrack(parts, max, withText) {   // one bar made of segments side by side; each segment's share of the whole
    var sum = 0; parts.forEach(function (p) { sum += p.v; });
    var kids = parts.filter(function (p) { return p.v > 0; }).map(function (p) {
      var share = pctW(p.v, max);
      return h("span", { class: "sg " + (p.cls || "") + (withText ? "" : " thin"), style: "flex:" + p.v + " 1 0" }, withText && share >= 9 ? fmt(p.v) : "");
    });
    return h("div", { class: "track" }, h("div", { class: "segs", style: "width:" + pctW(sum, max).toFixed(2) + "%" }, kids));
  }
  function barRows(rows, max) {   // rows: [{l, v, cls}]
    if (max == null) max = Math.max.apply(null, rows.map(function (r) { return r.v; }).concat(1));
    return h("div", { class: "rows" }, rows.map(function (r) {
      return h("div", { class: "row" }, h("div", { class: "lab" }, r.l), track(r.v, max, r.cls));
    }));
  }
  function topRows(map, label, n) {   // a sorted bar list; what is beyond the top n is added up as "Other"
    var e = sorted(map), rows = e.slice(0, n).map(function (x) { return { l: label(x[0]), v: x[1] }; });
    if (e.length > n) { var o = 0; e.slice(n).forEach(function (x) { o += x[1]; }); rows.push({ l: "Other (" + (e.length - n) + ")", v: o }); }
    return rows;
  }
  function kvRow(label, value, sub) {
    return h("div", null, h("div", { class: "kl" }, label, sub ? h("small", null, sub) : null), h("div", { class: "n" }, value));
  }

  // ---------- 1. pulse
  function secPulse() {

    }
    bar.hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll(".pill"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-range") === st.range ? "true" : "false"); });
    C = context(d, st.range); C.tz = d.tz || "Europe/Berlin";
    var m = $("main"); m.textContent = ""; m.setAttribute("data-state", "ok");
    [secPulse, secNew, secBack, secPlay, secHooks, secOnline, secHealth, foot].forEach(function (f) { m.appendChild(f()); });
    drawSpark();
  }

  function load() {
    if (st.busy) return;
    st.key = decodeHash();
    if (!st.key) { st.data = null; render(); return; }
    st.busy = true; st.err = null; st.at = st.at || 0;
    var fresh = st.data;
    if (fresh) chrome(); else render();
    fetch("/api/stats/data", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: st.key }), cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" })
      .then(function (r) { if (r.status === 404) throw "404"; if (r.status === 429) throw "429"; if (!r.ok) throw "net"; return r.json(); })
      .then(function (j) {
        if (!j || typeof j.today !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(j.today) || !j.days || typeof j.days !== "object") throw "net";
        st.data = j; st.at = Date.now(); st.err = null;
      })
      .catch(function (e) { st.err = typeof e === "string" ? e : "net"; if (st.err === "404") st.data = null; if (!fresh) st.data = null; })
      .then(function () { st.busy = false; st.tried = Date.now(); render(); });
  }
  function decodeHash() { var h0 = location.hash.replace(/^#/, ""); try { h0 = decodeURIComponent(h0); } catch (e) { /* keep as typed */ } return h0.trim(); }

  // ---------- wiring
  Array.prototype.forEach.call(document.querySelectorAll(".pill"), function (b) {
    b.addEventListener("click", function () {
      st.range = b.getAttribute("data-range");
      try { sessionStorage.setItem("pb-stats-range", st.range); } catch (e) { /* private window: fine */ }
      if (st.data) render();
    });
  });
  $("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && st.key && Date.now() - (st.tried || 0) > 3000) load(); });
  window.addEventListener("hashchange", function () { st.data = null; st.err = null; load(); });
  var raf = 0;
  window.addEventListener("resize", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawSpark); });
  try { var saved = sessionStorage.getItem("pb-stats-range"); if (saved === "today" || saved === "week" || saved === "month") st.range = saved; } catch (e) { /* ignore */ }
  load();
})();
</script>
